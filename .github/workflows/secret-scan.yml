name: Secret scan

# Защита от случайного коммита реальных токенов — в первую очередь через
# config_secret.json.example, который принудительно трекается в .gitignore.
# Guards against committing real tokens, mainly via the tracked example template.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    # GitHub-hosted раннер: скан не должен зависеть от доступности self-hosted Pi.
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # СКАЧИВАЕМ ВСЮ ИСТОРИЮ ИЗМЕНЕНИЙ ДЛЯ АНАЛИЗА КОММИТОВ

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Scan historical and modified files for secrets
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            RANGE="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          else
            BEFORE="${{ github.event.before }}"
            if [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || [ -z "$BEFORE" ]; then
              RANGE="${{ github.sha }}~1..${{ github.sha }}"
            else
              RANGE="$BEFORE..${{ github.sha }}"
            fi
          fi
          echo "[i] Scanning commit range: $RANGE"
          python3 scripts/check_secrets.py --range "$RANGE"

      - name: Verify config_secret.json and env variants are not tracked in worktree
        run: |
          if git ls-files --error-unmatch config_secret.json >/dev/null 2>&1; then
            echo "::error file=config_secret.json::Приватный конфиг попал в репозиторий / private config is tracked by git"
            exit 1
          fi
          echo "OK: config_secret.json не отслеживается git / is not tracked"
