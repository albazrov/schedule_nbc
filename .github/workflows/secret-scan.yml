name: Secret scan

# Защита от случайного коммита реальных токенов — в первую очередь через
# config_secret.json.example, который принудительно трекается в .gitignore.
# Guards against committing real tokens, mainly via the tracked example template.

on:
  push:
    branches: ['main', 'master', 'develop']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    # GitHub-hosted раннер: скан не должен зависеть от доступности self-hosted Pi.
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # СКАЧИВАЕМ ВСЮ ИСТОРИЮ ИЗМЕНЕНИЙ ДЛЯ АНАЛИЗА КОММИТОВ

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Scan historical and modified files for secrets
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            RANGE="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          else
            BEFORE="${{ github.event.before }}"
            if [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || [ -z "$BEFORE" ]; then
              RANGE="${{ github.sha }}~1..${{ github.sha }}"
            else
              RANGE="$BEFORE..${{ github.sha }}"
            fi
          fi
                    echo "[i] Scanning commit range: $RANGE"
          if ! python3 scripts/check_secrets.py --range "$RANGE"; then
            echo "::error::[SECURITY ALERT] Секреты были отправлены на сервер GitHub! Локальный хук обойдён. Изменения истории Git НЕдостаточно. Немедленно ДЕАКТИВИРУЙТЕ (ОТЗОВИТЕ) просочившиеся ключи и токены!"
            exit 1
          fi

      - name: Verify forbidden files are not tracked by git in worktree
        run: |
          # Ищем config_secret.json и любые вариации файлов .env.*
          FORBIDDEN=$(git ls-files | grep -E "(^|/)config_secret.*\.json$|(^|/)\.env(\..+)?$") || true
          
          if [ ! -z "$FORBIDDEN" ]; then
            echo "::error::В рабочий каталог репозитория попали приватные файлы конфигурации:"
            echo "$FORBIDDEN"
            exit 1
          fi
          echo "OK: Приватные файлы конфигурации (.env.*, config_secret.json) не отслеживаются Git"
